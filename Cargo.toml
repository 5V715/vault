[workspace]
resolver = "3"
members = ["vault-container", "vault-proto", "vault-server", "vault-mailbox", "vault-client"]

[workspace.package]
edition = "2024"
license = "MIT"
rust-version = "1.93"

[workspace.dependencies]
thiserror = "2"

# vaultctl derives its secrets-file key with Argon2id (64 MiB, t=3); keep that fast in debug builds/tests.
[profile.dev.package.argon2]
opt-level = 3
[profile.test.package.argon2]
opt-level = 3
