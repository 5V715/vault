# BOOTSTRAP / REFRESH of Gradle dependency verification for android/.
#
# Run by hand (Actions → "android verification metadata" → Run workflow) when
# android/gradle/verification-metadata.xml does not exist yet, or after a
# dependency or plugin version changes. It runs every Gradle task CI runs (build,
# lint, unit tests, and the instrumented test on an emulator, which resolves the
# test-platform artifacts) with `--write-verification-metadata sha256`, and
# uploads the file as the artifact `verification-metadata`. Review the diff and
# commit it as android/gradle/verification-metadata.xml; from then on the `android`
# CI jobs verify strictly (android/ci/gradle.sh switches on the file's presence).
#
# Nothing is cached in either direction, so every artifact is downloaded fresh
# from its repository before its checksum is recorded.
name: android verification metadata

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: never
  ANDROID_JDK: "21.0.13+9"

jobs:
  write:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: ${{ env.ANDROID_JDK }}
      - uses: ./.github/actions/android-toolchain
        with:
          sdk-packages: "true"
      - name: Gradle wrapper pin equals Gradle's published checksum
        run: android/ci/check-wrapper.sh
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
        with:
          cache-disabled: true
      - name: write verification metadata (build, lint, unit tests)
        working-directory: android
        run: >-
          ./gradlew --stacktrace --no-configuration-cache --write-verification-metadata sha256
          :core:test testDebugUnitTest lint assembleDebug assembleRelease :ffi:assembleDebugAndroidTest
          :app:dependencies
      - name: enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      # Same as ci.yml's emulator job: the runner's free disk is below what the
      # emulator's userdata partition needs unless unused toolchains are removed.
      - name: free disk space for the emulator
        run: |
          df -h / "$HOME"
          rm -rf target
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/.ghcup /usr/share/swift \
            /usr/local/share/boost /opt/hostedtoolcache/CodeQL /usr/local/lib/android/sdk/system-images/android-2*
          df -h / "$HOME"
      - name: add the instrumented-test artifacts (emulator, API 30)
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: 30
          arch: x86_64
          target: google_apis
          cores: 4
          ram-size: 4096M
          disk-size: 4096M
          emulator-boot-timeout: 900
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back none -no-metrics
          disable-animations: true
          working-directory: android
          script: ./gradlew --stacktrace --no-configuration-cache --write-verification-metadata sha256 -Pvault.abis=x86_64 :ffi:connectedDebugAndroidTest
      - name: summary
        run: |
          f=android/gradle/verification-metadata.xml
          test -s "$f"
          echo "components: $(grep -c '<component ' "$f")"
          sha256sum "$f"
      # The file also goes into the log (base64 between markers, plus its sha256),
      # for maintainers whose environment can read job logs but not artifact
      # storage. Extract with: gh run view <id> --log | sed -n ... | base64 -d,
      # then compare the sha256 with the one printed above.
      - name: verification metadata in the log (base64)
        run: |
          f=android/gradle/verification-metadata.xml
          echo "VERIFICATION-METADATA-SHA256 $(sha256sum "$f" | cut -d' ' -f1)"
          echo "-----BEGIN VERIFICATION-METADATA-----"
          base64 -w 76 "$f"
          echo "-----END VERIFICATION-METADATA-----"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: verification-metadata
          path: android/gradle/verification-metadata.xml
          if-no-files-found: error
