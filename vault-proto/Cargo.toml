[package]
name = "vault-proto"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "Wire messages, QR pair offer and chunking for the vault protocol"

[dependencies]
serde = { version = "1", default-features = false, features = ["derive", "alloc"] }
postcard = { version = "1", features = ["alloc"] }
base64 = { version = "0.22", default-features = false, features = ["alloc"] }
thiserror.workspace = true
snow = { version = "0.9", default-features = false, features = ["default-resolver"] }
hkdf = "0.12"
sha2 = "0.10"
zeroize = "1.9.2"
chacha20poly1305 = { version = "0.10", default-features = false, features = ["alloc"] }
subtle = "2.6.1"
curve25519-dalek = { version = "4", default-features = false, features = ["alloc"] }

# snow's default resolver uses rand 0.8 -> getrandom 0.2, which needs `js` on wasm32-unknown-unknown.
[target.'cfg(target_arch = "wasm32")'.dependencies]
getrandom = { version = "0.2", features = ["js"] }
