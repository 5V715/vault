[package]
name = "vault-container"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[features]
default = ["cli"]
# The `vaultctl` command-line tool; embedders (Android) build with `default-features = false`.
cli = ["dep:clap", "dep:rpassword", "dep:qrcode", "dep:argon2"]
# `Crk::from_bytes` / `Crk::to_bytes`: the raw root key, for hosts that wrap it
# under a device key (vault-ffi: the Android Keystore). Nothing else needs it.
raw-key-access = []

[[bin]]
name = "vaultctl"
path = "src/bin/vaultctl.rs"
required-features = ["cli"]

[dependencies]
clap = { version = "4", features = ["derive"], optional = true }
rpassword = { version = "7", optional = true }
qrcode = { version = "0.14", default-features = false, optional = true }
argon2 = { version = "0.5", optional = true }
thiserror.workspace = true
vault-proto = { path = "../vault-proto" }
aes-gcm = { version = "0.10", features = ["zeroize"] }
hkdf = "0.12"
sha2 = "0.10"
hmac = "0.12"
rand = "0.9"
zeroize = { version = "1", features = ["serde"] }
data-encoding = "2"
subtle = "2"
serde = { version = "1", features = ["derive"] }
postcard = { version = "1", features = ["alloc"] }
async-trait = "0.1"
tokio = { version = "1", features = ["rt", "sync"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls-webpki-roots"] }
quick-xml = "0.38"
futures = { version = "0.3", default-features = false, features = ["alloc"] }

[dev-dependencies]
rand_chacha = "0.9"
tokio = { version = "1", features = ["rt", "rt-multi-thread", "macros", "net"] }
tempfile = "3"
hyper = { version = "1", features = ["server", "http1"] }
hyper-util = { version = "0.1.21", features = ["tokio"] }
http-body-util = "0.1.5"
bytes = "1.12.2"
reqwest = { version = "0.12", default-features = false }
