# Gradle 9.9.2, pinned with its SHA-256 (taken from gradle/gradle's own wrapper
# properties on its release branch; CI also checks it against Gradle's published
# gradle-9.9.2-bin.zip.sha256, and the wrapper refuses a download that differs).
# gradlew, gradlew.bat and gradle-wrapper.jar are copied from gradle/gradle at tag
# v9.9.2; CI validates the jar against Gradle's known wrapper checksums.
distributionBase=GRADLE_USER_HOME
distributionPath=wrapper/dists
distributionSha256Sum=971fcd7150ca4ba04852c0b2ca0d2d0ab9468e14b03473eab19528809914c76b
distributionUrl=https\://services.gradle.org/distributions/gradle-9.9.2-bin.zip
networkTimeout=10000
validateDistributionUrl=true
zipStoreBase=GRADLE_USER_HOME
zipStorePath=wrapper/dists
